name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布 GitHub Release（关闭则仅构建 APK）'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $GITHUB_WORKSPACE/release.jks

      - name: Build release APK (自动重试)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: |
            chmod +x ./gradlew
            ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          VERSION=${{ steps.version.outputs.name }}
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            if [[ "$apk" == *"universal"* ]]; then
              mv "$apk" "Yanami-v${VERSION}-universal.apk"
            elif [[ "$apk" == *"arm64-v8a"* ]]; then
              mv "$apk" "Yanami-v${VERSION}-arm64-v8a.apk"
            elif [[ "$apk" == *"armeabi-v7a"* ]]; then
              mv "$apk" "Yanami-v${VERSION}-armeabi-v7a.apk"
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yanami-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/Yanami-*.apk

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: Yanami Pink 粉色少女版 ${{ steps.version.outputs.name }} (Build #${{ github.run_number }})
          draft: false
          prerelease: false
          body: |
            🌸 **Yanami Pink 粉色少女风版本** 🌸
            
            ## ✨ 本次更新内容：
            
            ### 🎨 界面美化
            - 全新粉色少女风主题
            - 浅粉色背景，柔和不刺眼
            - 粉色按钮和交互元素
            - 强制浅色模式，不跟随系统深色
            
            ### 📊 新增监控项
            - 实时网速显示（上传/下载速度）
            - 进程数统计
            - TCP连接数显示
            - UDP连接数显示
            - GPU型号显示
            
            ### 🛠️ 其他
            - 基于原作者 icylian/Yanami 1.1.0 修改
            - 保留原作者全部功能和版权声明
            - 优化稳定性，修复闪退问题
            
            ## 📱 下载说明：
            - arm64-v8a.apk：现代新手机推荐（64位）
            - armeabi-v7a.apk：老款32位手机
            - universal.apk：通用版，全兼容
          files: app/build/outputs/apk/release/Yanami-*.apk




