name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk yanami-pink.apk

      - name: Get Version
        id: version
        run: echo "version=v1.0.${{github.run_number}}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Yanami Pink Edition ${{ steps.version.outputs.version }}
          body: |
            ## 🌸 Yanami Pink Edition
            - 强制浅色模式，粉色少女风主题
            - 新增实时网速、进程数、TCP/UDP连接、GPU、在线天数显示
            - R8混淆 + 仅arm64架构，体积更小
            - Debug签名，直接安装即可
          files: yanami-pink.apk

