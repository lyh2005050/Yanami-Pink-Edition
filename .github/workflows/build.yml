name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Tools to PATH
        run: |
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/36.0.0" >> $GITHUB_PATH

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create Keystore
        run: |
          keytool -genkeypair -v -keystore yanami.keystore -alias yanami -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Yanami Pink, OU=Dev, O=Yanami, L=HK, ST=HK, C=CN"

      - name: Sign APK
        run: |
          apksigner sign --ks yanami.keystore --ks-pass pass:123456 --key-pass pass:123456 app/build/outputs/apk/release/app-release-unsigned.apk --out yanami-pink.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yanami-pink-apk
          path: yanami-pink.apk

